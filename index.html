<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101813">
  <title>체스 — 나의 한 수</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="체스 홈"><span class="brand-mark">♞</span><span>한 수<span class="brand-dot">.</span></span></a>
      <div class="top-meta"><span class="live-dot"></span><span>LOCAL MATCH</span></div>
      <button class="icon-button" id="flipBtn" title="보드 뒤집기" aria-label="보드 뒤집기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h15l-3-3m4 13H5l3 3"/></svg></button>
    </header>

    <section class="game-layout" aria-label="체스 게임">
      <section class="board-column">
        <div class="player-card opponent-card" id="blackPlayer">
          <div class="avatar black-avatar">♚</div><div class="player-info"><div class="player-name">검은색 <span class="you-tag" id="blackYou" hidden>YOU</span></div><div class="player-sub" id="blackCaptured"></div></div><div class="turn-indicator" id="blackTurn"></div>
        </div>
        <div class="board-wrap">
          <div class="board-coordinates left-coords" id="rankCoords" aria-hidden="true"></div>
          <div class="chessboard" id="board" role="grid" aria-label="체스 보드"></div>
          <div class="file-coords" id="fileCoords" aria-hidden="true"></div>
        </div>
        <div class="player-card bottom-player" id="whitePlayer">
          <div class="avatar white-avatar">♔</div><div class="player-info"><div class="player-name">흰색 <span class="you-tag" id="whiteYou">YOU</span></div><div class="player-sub" id="whiteCaptured"></div></div><div class="turn-indicator" id="whiteTurn"></div>
        </div>
      </section>

      <aside class="side-panel">
        <div class="panel-heading"><div><div class="eyebrow">CHESS / TWO PLAYER</div><h1>오늘의 대국</h1></div><div class="game-number">01</div></div>
        <div class="turn-card" id="turnCard"><div class="turn-piece" id="turnPiece">♙</div><div class="turn-copy"><span class="turn-label" id="turnLabel">흰색 차례</span><strong id="gameStatus">첫 수를 두어보세요</strong></div><span class="status-pulse"></span></div>
        <div class="move-section"><div class="section-title"><span>기보</span><span class="move-count" id="moveCount">0 수</span></div><div class="move-list" id="moveList" aria-live="polite"><div class="empty-moves"><span>♟</span><p>첫 수를 기다리고 있어요</p><small>말을 선택해 이동해 보세요</small></div></div></div>
        <div class="action-row"><button class="action-button secondary" id="undoBtn" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-2"/></svg><span>한 수 무르기</span></button><button class="action-button primary" id="newGameBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5m-4-1a7 7 0 0 1 12-4l3 3M4 12l3 3a7 7 0 0 0 12-4"/></svg><span>새 게임</span></button></div>
        <div class="panel-footer"><span class="footer-mark">♞</span><span>차분히, 한 수씩.</span><span class="keyboard-hint">클릭 또는 드래그</span></div>
      </aside>
    </section>
    <footer class="mobile-footer">체스는 서두르지 않아도 괜찮아요.</footer>
  </main>

  <div class="promotion-backdrop" id="promotionDialog" hidden role="dialog" aria-modal="true" aria-labelledby="promotionTitle"><div class="promotion-card"><div class="eyebrow">PROMOTION</div><h2 id="promotionTitle">무엇으로 승격할까요?</h2><p>폰을 원하는 기물로 바꾸세요.</p><div class="promotion-options" id="promotionOptions"></div><button class="cancel-promotion" id="cancelPromotion">취소</button></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
